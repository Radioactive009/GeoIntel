[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    # SQLAlchemy and the app still call datetime.utcnow(), which 3.12+ warns
    # about. Naive UTC is deliberate here — every comparison in the codebase
    # assumes it — so the warning is noise until that is migrated wholesale.
    ignore::DeprecationWarning

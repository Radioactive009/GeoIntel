<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Per-route values are set at runtime by components/Seo.jsx; these are
         the defaults a crawler sees before React mounts. -->
    <title>GeoIntel — Global Conflict &amp; Risk Monitor</title>
    <meta name="description" content="Live geopolitical news from international wire services, with every story attributed to a country and scored for risk." />
    <meta name="theme-color" content="#020617" />
    <link rel="canonical" href="https://geointel.app/" />

    <meta property="og:site_name" content="GeoIntel" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GeoIntel — Global Conflict &amp; Risk Monitor" />
    <meta property="og:description" content="Live geopolitical news from international wire services, with every story attributed to a country and scored for risk." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Serif for headlines, Inter for text: the pairing news sites use, and
         now the same families tailwind.config.js declares. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

# Runs the test suite on every push.
#
# The suite exists because this project shipped a keyword pattern that matched
# "bank" as harm, an `IS NOT 'string'` comparison that is valid on SQLite and a
# syntax error on Postgres, and a snapshot bug that recorded a cumulative mean
# for months without anyone noticing. Each is now covered — but only if
# something actually runs them.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # Every test runs against a throwaway SQLite file and stubs the
        # network, so this needs no secrets and cannot touch the live feeds.
        run: python -m pytest

  frontend:
    name: lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The test runner is node:test, built in since 18 — the glob form
          # used by `npm test` needs 21 or later.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # The lint script and its plugins were in package.json for months with
        # no config file, so it failed to start and nothing was ever checked.
        run: npm run lint

      - name: Test
        # The pure logic the interface depends on: which voice to speak with,
        # when a spoken conversation has ended, and how to find a blendshape
        # across exporters that all name it differently.
        run: npm test

      - name: Build
        # A broken import or unclosed JSX tag fails here rather than on the
        # deployed site.
        run: npm run build
